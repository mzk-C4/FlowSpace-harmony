<body>

<div class="app"><header class="topbar"><div class="wordmark"><span class="logo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="6" height="6" rx="2"/><path d="M8 12h5V5h4m-4 7v7h4"/><path d="M17 2h5v6h-5zm0 14h5v6h-5z"/></svg></span>FlowSpace</div><button class="icon-btn" aria-label="页面说明与分工" onclick="openHandoff()"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg></button></header>
<main>
<section id="page-home" class="page" aria-label="首页"><h1>新建思维导图</h1><div class="home-grid"><div class="input-group"><div class="composer"><label for="prompt">主题 / 长文</label><textarea id="prompt" maxlength="20000" placeholder="写下主题，或粘贴需要整理的文字…"></textarea><div class="composer-foot"><small><span id="char-count">0</span> / 20000</small><button class="primary" onclick="generateDemo()">生成演示导图</button></div></div><div class="chips" aria-label="示例主题"><button class="chip" onclick="fillPrompt('梳理数据结构中的线性结构：数组、链表、栈与队列')">数据结构</button><button class="chip" onclick="fillPrompt('帮我梳理微积分的核心概念与学习路径')">微积分</button><button class="chip" onclick="fillPrompt('整理一个个人项目从想法到上线的流程')">项目流程</button></div><button class="secondary full" style="margin-top:15px" onclick="openExample()" aria-label="打开信号与系统示例导图">打开示例导图 · 信号与系统</button><p class="input-note">离线演示，不调用真实 AI。可继续手工编辑与保存。</p></div><div class="home-section"><div class="section-head"><h2>最近导图</h2><button onclick="switchPage('profile')">全部</button></div><div id="recent-list"></div></div><div class="home-section"><div class="section-head"><h2>工科视频</h2><button onclick="showVideos()">全部视频</button></div><div id="video-list"></div></div></div></section>
<section id="page-diy" class="page editor-page" aria-label="DIY思维导图" hidden><div class="editor-head"><div><h2 id="map-title">新的想法</h2><small id="map-status">保存在此浏览器</small></div><button class="icon-btn" onclick="openExport()">导出 <span aria-hidden="true">↗</span></button></div><div class="editor-grid"><div class="canvas-column"><div class="editor-toolbar"><button id="undo" onclick="undo()" aria-label="撤销"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-6 6 6 6M3 10h10a7 7 0 0 1 7 7"/></svg></button><button id="redo" onclick="redo()" aria-label="重做"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 6 6-6 6m6-6H11a7 7 0 0 0-7 7"/></svg></button><span class="toolbar-spacer"></span><button onclick="nodeDialog('addChild')">＋ 节点</button><button onclick="openEditorMenu()" aria-label="更多导图操作">更多 ···</button></div><div class="canvas-wrap" id="canvas-wrap"><svg id="map-svg" role="group" aria-roledescription="思维导图" aria-label="可交互思维导图，点击节点选择；2D 拖动画布平移，3D 单指旋转视角" xmlns="http://www.w3.org/2000/svg"></svg><div class="canvas-bottom"><small id="node-count">0 个节点</small><div><button id="view-toggle" onclick="toggleViewMode()" aria-label="切换二维或三维视图" style="font-size:10px">2D</button><button onclick="zoomBy(.8)" aria-label="缩小导图">−</button><small id="zoom-label">100%</small><button onclick="zoomBy(1.25)" aria-label="放大导图">＋</button><button onclick="fitMap()" style="font-size:10px">适应</button><button id="reset-view" hidden onclick="resetView3D()" aria-label="重置三维视角" style="font-size:10px">复位</button></div></div></div><div class="selected-info"><label>选中节点</label><div class="row"><strong id="selected-label"></strong><div><button class="secondary" onclick="nodeDialog('edit')">编辑</button></div></div></div><details class="source"><summary>原始输入</summary><p id="source-text"></p></details></div><div class="chat-panel"><div class="chat-title">继续整理 <span class="demo-badge">离线演示</span></div><div class="chat-log" id="chat-log"></div><div id="candidate-b
